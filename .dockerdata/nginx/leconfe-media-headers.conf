# Response headers for uploaded media served from /storage.
# Prevent MIME sniffing and restrict content policy for document-like formats.
location ^~ /storage/ {
    add_header X-Content-Type-Options "nosniff" always;

    location ~* ^/storage/.*\.(?:svgz?|xml|html?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'none'; object-src 'none'; base-uri 'none'; sandbox" always;
    }

    try_files $uri /index.php?$query_string;
}